<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>반응속도 테스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e7e9f7;
    user-select: none;
  }
  #stage {
    height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
    background: #171b31;
    transition: background 120ms;
    cursor: pointer;
  }
  #stage.wait  { background: #7a1f3d; }
  #stage.go    { background: #1f7a4a; }
  #stage.ready { background: #171b31; }
  #stage.fail  { background: #5a1a1a; }
  h1 { font-size: clamp(22px, 6vw, 34px); margin: 0 0 10px; font-weight: 900; letter-spacing: -0.02em; }
  p  { margin: 0; font-size: clamp(13px, 3.4vw, 16px); opacity: 0.75; line-height: 1.6; }
  .big { font-size: clamp(40px, 12vw, 72px); font-weight: 900; font-variant-numeric: tabular-nums; }

  /*
    라운드 진행 표시는 화면 한가운데 둡니다.
    구석에 두면 플랫폼이 얹는 전체화면 버튼·점수 칩에 가려서,
    "이게 언제 끝나는 거지?" 가 됩니다.
  */
  #dots { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(231, 233, 247, 0.2);
    transition: background 140ms, transform 140ms;
  }
  .dot.done { background: #b6ff3c; }
  .dot.now  { background: rgba(231, 233, 247, 0.75); transform: scale(1.25); }
  #times {
    margin-top: 10px; min-height: 1.2em;
    font-size: 13px; opacity: 0.55; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="stage" class="ready">
    <div>
      <h1 id="title">반응속도 테스트</h1>
      <p id="hint">화면을 눌러 시작하세요<br>초록으로 바뀌는 순간 바로 누르면 됩니다 · 5회 평균</p>
      <div id="dots"></div>
      <p id="times"></p>
    </div>
  </div>

<script src="/sdk/arcade.js"></script>
<script>
(function () {
  var stage   = document.getElementById("stage");
  var title   = document.getElementById("title");
  var hint    = document.getElementById("hint");
  var dotsEl  = document.getElementById("dots");
  var timesEl = document.getElementById("times");

  var TOTAL = 5;
  var state = "ready";      // ready | wait | go | result | done
  var times = [];
  var timer = null;
  var greenAt = 0;
  var greeting = "";

  Arcade.ready(function (config) {
    greeting = config.player.name + "님, ";
    if (state === "ready") setText("화면을 눌러 시작하세요<br>초록으로 바뀌는 순간 바로 누르면 됩니다 · 5회 평균", true);
  });

  function setStage(cls) { stage.className = cls; }

  /** 인사말은 시작 전에만 붙입니다 — 판 중에는 남은 라운드가 더 중요합니다. */
  function setText(html, withGreeting) {
    hint.innerHTML = (withGreeting ? greeting : "") + html;
  }

  function round() { return times.length + 1; }

  function render() {
    var html = "";
    for (var i = 0; i < TOTAL; i++) {
      var cls = "dot";
      if (i < times.length) cls += " done";
      else if (i === times.length && (state === "wait" || state === "go")) cls += " now";
      html += '<span class="' + cls + '"></span>';
    }
    dotsEl.innerHTML = html;
    timesEl.textContent = times.length
      ? times.map(function (t) { return Math.round(t); }).join(" · ") + " ms"
      : "";
  }

  function average() {
    return times.reduce(function (a, b) { return a + b; }, 0) / times.length;
  }

  function beginRound() {
    state = "wait";
    setStage("wait");
    title.textContent = "기다리세요…";
    setText(round() + " / " + TOTAL + " 라운드 · 초록으로 바뀌면 바로 누르기");
    render();

    var delay = 1200 + Math.random() * 2600;
    timer = setTimeout(function () {
      state = "go";
      setStage("go");
      title.textContent = "지금!";
      setText(round() + " / " + TOTAL + " 라운드");
      render();
      greenAt = performance.now();
    }, delay);
  }

  function finishRound(ms) {
    times.push(ms);
    state = "result";
    setStage("ready");
    title.innerHTML = '<span class="big">' + Math.round(ms) + '</span> ms';

    if (times.length >= TOTAL) {
      var avg = Math.round(average());
      state = "done";
      title.innerHTML = '<span class="big">' + avg + '</span> ms';
      setText("5회 평균 — 기록을 제출했습니다<br>눌러서 다시 도전");
      render();
      Arcade.gameOver(avg, { attempts: times.map(Math.round) });
      return;
    }

    // 진행 중 평균을 플랫폼 점수 칩에도 흘려보냅니다 (검증용 점수 곡선도 여기서 쌓입니다).
    Arcade.progress(Math.round(average()));
    setText(times.length + " / " + TOTAL + " 완료 · 눌러서 다음 라운드");
    render();
  }

  function onPress() {
    if (state === "ready" || state === "done") {
      times = [];
      Arcade.start();
      beginRound();
      return;
    }

    if (state === "wait") {
      // 초록 전에 누름 — 이번 라운드는 기록에 넣지 않고 다시 합니다.
      clearTimeout(timer);
      state = "result";
      setStage("fail");
      title.textContent = "너무 빨랐어요";
      setText(round() + " / " + TOTAL + " 라운드 다시 · 눌러서 계속");
      render();
      return;
    }

    if (state === "go") {
      finishRound(performance.now() - greenAt);
      return;
    }

    if (state === "result") {
      beginRound();
      return;
    }
  }

  stage.addEventListener("pointerdown", function (e) { e.preventDefault(); onPress(); });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); onPress(); }
  });

  render();
})();
</script>
</body>
</html>
